version: "3.9"

services:
  # ── Base de datos PostgreSQL ─────────────────
  db:
    image: postgres:16
    container_name: vigia_db
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia_user
      POSTGRES_PASSWORD: vigia_pass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [vigia-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Panel de administración BD ───────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: vigia_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vigia.co
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    depends_on: [db]
    networks: [vigia-net]

  # ── Backend FastAPI + Frontend estático ──────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigia_backend
    ports: ["8000:8000"]
    env_file:
      - ./backend/.env
    depends_on: [db]
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks: [vigia-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vigia-net:
    driver: bridge

volumes:
  pgdata:
